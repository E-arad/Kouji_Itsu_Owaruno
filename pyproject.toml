[project]
name = "Kouji_Itsu_Owaruno"
version = "0.1.0"
description = "地図の上を2回クリックして、歩ける道をたどる経路を表示する"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["map", "pathfinding", "bfs", "image", "gui"]
classifiers = [
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "scipy>=1.10",
]

[project.scripts]
kouji = "Kouji_Itsu_Owaruno.__main__:main"

[project.urls]
Repository = "https://github.com/E-arad/Kouji_Itsu_Owaruno"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/Kouji_Itsu_Owaruno"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff 固有
]
ignore = [
    "RUF001",  # 全角括弧などを含む日本語文字列を許可する
    "RUF002",
    "RUF003",
    "N999",    # パッケージ名を作者の意図どおり Kouji_Itsu_Owaruno のままにする
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
# CI では型検査を 3.12 の1環境に集約している。.github/workflows/ci.yml を参照。
files = ["src", "tests"]
strict = true
warn_unreachable = true
# scipy は型情報を同梱していないため、この依存だけ緩める
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
